services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-treeapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-treeapp}
      POSTGRES_DB: ${POSTGRES_DB:-tree_risk}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-treeapp} -d ${POSTGRES_DB:-tree_risk}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
